<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibePulse — Personal Music Analytics Dashboard</title>
  <meta name="description" content="Personal Spotify listening statistics, top tracks, top artists, and streaming habits.">
  <link rel="icon" type="image/svg+xml" href="assets/placeholder-cover.svg">

  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Bar: Profile, Range Toggle, Share Button -->
    <header id="dashboard-header" class="dashboard-header" role="banner" aria-label="Dashboard controls and profile header">
      <!-- Populated dynamically by js/render.js -->
    </header>

    <!-- Bento Grid Dashboard Surface -->
    <main class="bento-grid" id="dashboard-bento" role="main" aria-label="Music listening statistics bento grid">
      <!-- Row 1: Hero Track #1, Listening Time, Top Genres -->
      <section id="card-hero-track" class="bento-card col-hero" aria-label="Top Track #1">
        <!-- Rendered by js/render.js -->
      </section>

      <section id="card-listening-time" class="bento-card col-listening-time" aria-label="Listening Time Metric">
        <!-- Rendered by js/render.js -->
      </section>

      <section id="card-top-genres" class="bento-card col-top-genres" aria-label="Top Genres Distribution">
        <!-- Rendered by js/render.js -->
      </section>

      <!-- Row 2: Top Tracks (01-10 with real album art) & Top Artists -->
      <section id="card-top-tracks" class="bento-card col-top-tracks" aria-label="Top 10 Tracks List">
        <!-- Rendered by js/render.js -->
      </section>

      <section id="card-top-artists" class="bento-card col-top-artists" aria-label="Top 5 Artists Ranking">
        <!-- Rendered by js/render.js -->
      </section>

      <!-- Row 3: Listening Intensity Heatmap & Live Recent Streams -->
      <section id="card-heatmap" class="bento-card col-heatmap" aria-label="Listening Intensity Heatmap">
        <!-- Rendered by js/render.js -->
      </section>

      <section id="card-recent-streams" class="bento-card col-recent-streams" aria-label="Live Streams Stream">
        <!-- Rendered by js/render.js -->
      </section>
    </main>

    <!-- Dashboard Footer -->
    <footer class="dashboard-footer" role="contentinfo">
      <div class="footer-left">
        <span class="footer-brand">© 2026 VibePulse</span>
        <span class="footer-sep">•</span>
        <span class="footer-creator">Made with ♥ by Rizwan</span>
      </div>
      <div class="footer-links">
        <a href="https://github.com/syed-rizwan-ali" target="_blank" rel="noopener noreferrer" class="footer-link" title="Rizwan's GitHub Profile">
          <svg class="footer-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
        <a href="https://open.spotify.com/user/31o5qqanokkekjyukuuspejcsixm" target="_blank" rel="noopener noreferrer" class="footer-link" title="Rizwan's Spotify Profile">
          <svg class="footer-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
          <span>Spotify</span>
        </a>
      </div>
    </footer>
  </div>

  <!-- Weekly Recap Modal Dialog -->
  <div id="recap-modal" class="recap-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <!-- Rendered dynamically by js/render.js -->
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
